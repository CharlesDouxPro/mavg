# Trois services sur la même machine : MiniMax-H3 (inference) et le LLM (llm), tous deux sur
# les GPU, et l'agent (main). Les deux moteurs ne tiennent pas ensemble en mémoire : l'agent
# réveille l'un et endort l'autre selon l'étape (providers/gpu_share.py). Au repos, le LLM est
# éveillé et H3 dort.
#
# Ce fichier est le même en local et sur Scaleway. Ce qui change d'une machine à l'autre,
# c'est-à-dire où sont les poids sur l'hôte, vit dans un profil de déploiement :
#   docker compose --env-file docker/onprem.env   up -d --build
#   docker compose --env-file docker/scaleway.env up -d --build
#
# L'agent tourne en lot : il vide la file Mongo, envoie les rapports, puis s'arrête.
# Pour que l'inférence s'arrête avec lui (l'instance cloud) :
#   docker compose --env-file docker/scaleway.env up --exit-code-from agent
# En local, l'inférence reste chargée ; relancer un lot : `docker compose ... up agent`.

name: mavg

services:
  inference:
    build: docker/inference
    # Tag poussé par `docker/push.sh inference` ; `dev` pour un build local.
    image: rg.fr-par.scw.cloud/mavg-container-registery/mavg-inference:${INFERENCE_TAG:-dev}
    restart: unless-stopped
    ipc: host # NCCL entre les GPU a besoin de la mémoire partagée de l'hôte
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      HF_HUB_OFFLINE: "1" # jamais de téléchargement : des poids absents font échouer le démarrage
      H3_MODEL_PATH: ${H3_MODEL_PATH:?}
      H3_LORA_FILE: ${H3_LORA_FILE:?}
      H3_NUM_GPUS: ${H3_NUM_GPUS:-2}
      H3_TP_SIZE: ${H3_TP_SIZE:-2}
    volumes:
      # Le point de montage garde le nom du modèle : sglang reconnaît MiniMax-H3 à son chemin
      # (`…/MiniMax-H3` ou `…/models--MiniMaxAI--MiniMax-H3/…`). Sans lui, il lit
      # model_index.json, ne connaît pas `MiniMaxH3ModularPipeline` et échoue via diffusers.
      - ${WEIGHTS_DIR:?lance compose avec --env-file docker/onprem.env ou docker/scaleway.env}:${WEIGHTS_MOUNT:-/weights}:ro
      - ${LORA_DIR:?}:/loras:ro
      # L'agent passe la frame de référence par son chemin : le serveur doit la voir au même endroit.
      - assets:/app/assets:ro
      # Kernels JIT et caches torch, gardés quand le conteneur est recréé.
      - inference-cache:/root/.cache
    ports:
      - "127.0.0.1:30010:30010" # joignable depuis l'hôte seulement, pour curl ; l'agent passe par le réseau interne
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:30010/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20m # ~135 Go à charger, bien plus lent depuis un block storage réseau

  # Le LLM de l'agent (planification, e-mails d'échec), sur l'API Anthropic de sglang (/v1/messages).
  # Même image que l'inférence. Il démarre une fois H3 chargé, l'endort et prend les cartes
  # entières : redémarrer `inference` seul échoue tant que le LLM occupe les GPU (relancer les deux).
  llm:
    build: docker/inference
    image: rg.fr-par.scw.cloud/mavg-container-registery/mavg-inference:${INFERENCE_TAG:-dev}
    entrypoint: ["/usr/local/bin/llm-entrypoint.sh"]
    restart: unless-stopped
    ipc: host
    depends_on:
      inference:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      HF_HUB_OFFLINE: "1"
      HF_HUB_CACHE: /llm-weights # un repo (`Qwen/…`) dans LLM_MODEL_PATH est cherché ici
      LLM_MODEL_PATH: ${LLM_MODEL_PATH:?}
      LLM_SERVED_NAME: ${LLM_SERVED_NAME:?} # sglang ne vérifie pas le `model_name` des channels
      LLM_QUANTIZATION: ${LLM_QUANTIZATION:-}
      LLM_TP_SIZE: ${LLM_TP_SIZE:-2}
      H3_URL: http://inference:30010
      # /health génère un token par défaut : pendant le sommeil, la requête attend le réveil
      # et le service passe unhealthy. Sans génération, /health dit seulement que le serveur vit.
      SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION: "0"
    volumes:
      - ${LLM_WEIGHTS_DIR:?}:/llm-weights:ro
      - llm-cache:/root/.cache
    ports:
      - "127.0.0.1:30000:30000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:30000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20m # poids, kernels flashinfer compilés au premier lancement, CUDA graphs

  agent:
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
      secrets: [env] # .env.local embarqué dans l'image, comme avec docker/push.sh
    # Tag poussé par `docker/push.sh` (le SHA du commit) ; `dev` pour un build local.
    image: rg.fr-par.scw.cloud/mavg-container-registery/mavg-agent:${AGENT_TAG:-dev}
    restart: "no" # un lot fini ne doit pas être relancé
    depends_on:
      inference:
        condition: service_healthy
      llm:
        condition: service_healthy
    # Les secrets sont embarqués dans l'image (registre privé) ; .env.local, s'il existe, prime.
    env_file:
      - path: .env.local
        required: false
    environment:
      MINIMAX_BASE_URL: http://inference:30010/v1 # prime sur la valeur de .env.local
      LLM_BASE_URL: http://llm:30000
      SHARE_GPUS: "1" # les deux moteurs se relaient sur les GPU
      EXIT_WHEN_EMPTY: "1" # s'arrêter une fois la file vidée et les rapports envoyés
    volumes:
      - assets:/app/assets
      - ./runs:/app/runs # clips et montages, lisibles depuis l'hôte
      - whisper-cache:/root/.cache/huggingface # poids faster-whisper, téléchargés une seule fois

secrets:
  env:
    file: .env.local

volumes:
  assets:
  inference-cache:
  llm-cache:
  whisper-cache:
